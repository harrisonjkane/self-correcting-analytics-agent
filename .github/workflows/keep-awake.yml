name: keep demo awake

on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours; Streamlit sleeps apps after ~12h idle
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
